    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
        /* 自定义精美横向滚动条 */
        .custom-scrollbar::-webkit-scrollbar {
            height: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #991b1b; /* 福立得红 */
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #7f1d1d;
        }
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #991b1b #f1f5f9;
            scroll-behavior: smooth;
        }
    </style>
</head>

            // 4. 宠物系列
            { id: 9, name: "60cm加长防咬抓宠物训练手套", category: "宠物系列", isHot: true, price: "获取报价", desc: "加厚牛皮直达小臂，内衬凯夫拉防割纤维，防大型猛犬抓咬。", img: "https://images.unsplash.com/photo-1583337130417-3346a1be7dee?auto=format&fit=crop&q=80&w=800" },
            { id: 10, name: "猫咪洗护专用柔韧防抓手套", category: "宠物系列", isHot: false, price: "获取报价", desc: "鹿皮或羊皮复合高密度海绵层，兼顾操作灵活性与防刺破能力。", img: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&q=80&w=800" },

            // 5. 极端特种系列
            { id: 11, name: "TPR防砸减震石油钻井手套", category: "极端特种系列", isHot: true, price: "获取报价", desc: "手背热塑性橡胶减震，掌心玻纤防割，应对极端重机械碰撞。", img: "https://images.unsplash.com/photo-1504328345606-18bbc8c9d7d1?auto=format&fit=crop&q=80&w=800" },
            { id: 12, name: "零下30度极寒冷库保暖手套", category: "极端特种系列", isHot: false, price: "获取报价", desc: "内置3M Thinsulate™ 保暖棉，防水防油，极寒户外施工必备。", img: "https://images.unsplash.com/photo-1616422285623-aa30eb0ecb32?auto=format&fit=crop&q=80&w=800" }

            { name: "极端特种系列", icon: "zap", desc: "TPR防撞防割、极寒保暖、防重油化浸渍等深度定制" }
        ];

        const MOCK_ORDERS = [
            { id: "FLD-260417-001", product: "16英寸加长特厚电焊手套", quantity: "5,000 双", date: "2026-04-10", status: "生产中", statusColor: "text-blue-600", icon: "clock" },
            { id: "FLD-260322-089", product: "60cm加长防咬宠物手套", quantity: "15,000 双", date: "2026-03-22", status: "已发货 (海上)", statusColor: "text-orange-500", icon: "truck" },
            { id: "FLD-260115-024", product: "美式半皮帆布安全袖口手套", quantity: "8,000 双", date: "2026-01-15", status: "已交付", statusColor: "text-green-600", icon: "check-circle" }
        ];

        // ==========================================
        // 2. 全局状态管理 (State)
        // ==========================================
        let state = {
            currentView: 'home',
            isMenuOpen: false,
            isLoggedIn: false,
            showLoginModal: false,
            loginMethod: 'wechat'
        };

        let autoScrollInterval; // 用于爆款专区的轮播

        // ==========================================
        // 3. 业务逻辑函数 (Actions)
        // ==========================================
        function navigate(view) {
            if (view === 'orders' && !state.isLoggedIn) {
                state.showLoginModal = true;
                state.isMenuOpen = false;
                render();
                return;
            }
            state.currentView = view;
            state.isMenuOpen = false;
            window.scrollTo(0, 0);
            render();
        }

        function toggleMenu() {
            state.isMenuOpen = !state.isMenuOpen;
            render();
        }

        function toggleLoginModal(show) {
            state.showLoginModal = show;
            render();
        }

        function setLoginMethod(method) {
            state.loginMethod = method;
            render();
        }

        function handleLogin(e) {
            if (e) e.preventDefault();
            state.isLoggedIn = true;
            state.showLoginModal = false;
            navigate('orders');
        }

        function imgError(img) {
            img.onerror = null;
            img.src = '福立得标志.jpg';
        }

        // ==========================================
        // 4. 爆款专区自动滚动逻辑 (Auto Scroll)
        // ==========================================
        function initAutoScroll() {
            clearInterval(autoScrollInterval);
            const container = document.getElementById('hot-scroll-container');
            if (!container) return;

            autoScrollInterval = setInterval(() => {
                // 如果鼠标悬停在容器上，暂停滚动
                if(container.matches(':hover') || container.matches(':active')) return;

                // 找到内部第一张卡片的宽度来计算滚动距离 (卡片宽度 + gap)
                const firstCard = container.querySelector('div');
                if(!firstCard) return;
                
                const cardWidth = firstCard.offsetWidth + 24; 
                let nextScroll = container.scrollLeft + cardWidth;
                
                // 如果已经滑到底部附近，则复位到起点
                if (nextScroll >= container.scrollWidth - container.clientWidth + 10) {
                    container.scrollTo({ left: 0, behavior: 'smooth' });
                } else {
                    container.scrollTo({ left: nextScroll, behavior: 'smooth' });
                }
            }, 3000); // 每 3 秒滚动一次
        }

        // ==========================================
        // 5. 共享组件渲染 (Components)
        // ==========================================

            return `

                    </div>
                    <div class="p-6 flex-1 flex flex-col">
                        <span class="text-xs font-bold text-red-800 tracking-widest uppercase mb-2">${p.category}</span>
                        <h3 class="text-xl font-black text-slate-900 mb-3 leading-tight">${p.name}</h3>
                        <p class="text-slate-500 text-sm mb-6 line-clamp-2 leading-relaxed">${p.desc}</p>

                            <span class="font-black text-lg text-slate-800">${p.price}</span>
                            <button onclick="toggleLoginModal(true)" class="bg-slate-900 text-white px-5 py-2 text-sm font-bold rounded hover:bg-red-800 transition shadow-md whitespace-nowrap">获取工厂价</button>
                        </div>
                    </div>
                </div>
            `;
        }

                            <button onclick="navigate('orders')" class="hover:text-red-800 ${state.currentView === 'orders' ? 'text-red-800 border-b-2 border-red-800' : ''}">订单记录</button>

                                    <i data-lucide="user" class="w-5 h-5 text-red-800"></i>
                                    <span>客户 8099</span>

                                <button onclick="toggleLoginModal(true)" class="flex items-center gap-2 bg-red-800 text-white px-6 py-2 rounded font-bold hover:bg-red-900 transition shadow-lg shadow-red-900/20">

                            </button>
                        </div>
                    </div>
                </div>

                ${state.isMenuOpen ? `

                                浏览商品矩阵 <i data-lucide="chevron-right" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <div class="hidden md:block relative">
                            <img src="https://images.unsplash.com/photo-1581092160562-40aa08e78837?auto=format&fit=crop&q=80&w=800" onerror="imgError(this)" alt="全品类皮手套" class="rounded border-8 border-slate-800 shadow-2xl transform rotate-3 hover:rotate-0 transition duration-500" />
                        </div>
